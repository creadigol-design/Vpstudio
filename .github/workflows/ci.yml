name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Prisma CLI needs a URL to parse the schema; no database is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema and generate client
        run: pnpm --filter @virtual-studio/database validate && pnpm --filter @virtual-studio/database generate

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test
